name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: loguser
          POSTGRES_PASSWORD: logpassword
          POSTGRES_DB: logs_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U loguser -d logs_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run tests
        env:
          DATABASE_URL: postgresql://loguser:logpassword@localhost:5432/logs_test_db
          TEST_DATABASE_URL: postgresql://loguser:logpassword@localhost:5432/logs_test_db
        run: |
          pytest -v
